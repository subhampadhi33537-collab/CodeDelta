[project]
name = "codedelta-backend"
version = "0.1.0"
description = "CodeDelta – AI-powered website builder backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi==0.115.12",
    "uvicorn[standard]==0.34.2",
    # Settings / validation
    "pydantic==2.11.3",
    "pydantic-settings==2.9.1",
    "email-validator==2.2.0",
    # Auth
    "PyJWT==2.10.1",
    "argon2-cffi==23.1.0",
    # DB
    "psycopg[binary,pool]==3.2.9",
    # HTTP client
    "httpx==0.28.1",
    # Env
    "python-dotenv==1.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.5",
    "pytest-asyncio==0.25.3",
    "httpx==0.28.1",
    "ruff==0.11.7",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
